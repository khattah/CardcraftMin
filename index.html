<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardCraft Mini</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>
        <div class="card">

            <img src="images/omer.jpeg" alt="Profile photo">

            <h1>Omar Hamad</h1>

            <h2>Full-Stack Web Developer</h2>

            <p>
                I am a passionate web developer who enjoys creating
                simple and useful digital experiences.
            </p>

            <a class="contact" href="mailto:omar@example.com">
                Contact Me
            </a>

            <div class="icons">
                <a href="mailto:omar@example.com">📧</a>
                <a href="https://www.linkedin.com">💼</a>
                <a href="https://www.instagram.com">📷</a>
            </div>

        </div>
    </main>

</body>
</html>
